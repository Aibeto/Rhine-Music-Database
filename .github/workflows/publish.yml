name: Publish Existing Build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Existing build Run ID'
        required: true
        type: string
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          STATUS=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '.conclusion')

          SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '.head_sha')

          if [ "$STATUS" != "success" ]; then
            echo "Build run is not successful: $STATUS"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download existing artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Collect release files
        run: |
          set -euo pipefail

          mkdir -p release

          # macOS 与 Windows 交付 ZIP，Linux 交付 AppImage；三端各取一份打包产物。
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' \) \
            -exec cp -n {} release/ \;

          zips=$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)
          images=$(find release -maxdepth 1 -type f -name '*.AppImage' | wc -l)

          if [ "$zips" -ne 2 ] || [ "$images" -ne 1 ]; then
            echo "Expected 2 ZIP and 1 AppImage files, found $zips ZIP and $images AppImage"
            exit 1
          fi

          # upload-artifact 与 download-artifact 之间以 zip 往返，可执行位会丢失；
          # 恢复后才能让下载者直接双击运行。
          chmod 0755 release/*.AppImage

          ls -lh release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ steps.build.outputs.sha }}
          files: |
            release/*.zip
            release/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
