name: Publish Versioned Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful desktop build Run ID (its commit will be rebuilt with the release version)'
        required: true
        type: string
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH, e.g. v1.0.0)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: Validate source build and version
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Use a stable release tag such as v1.0.0'; exit 1;
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['conclusion'] == 'success', 'Source build must have succeeded'
          assert run['path'] == '.github/workflows/desktop.yml', 'Choose a Desktop build run'
          assert run['event'] != 'pull_request', 'Choose a build of a repository commit'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Foreign source'
          assert all(int(part) <= 65535 for part in os.environ['RELEASE_TAG'][1:].split('.'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
              output.write('tag=' + os.environ['RELEASE_TAG'] + '\n')
          PY
          # 已使用的 tag 不覆盖；包内版本和下载地址在发布后应保持稳定。
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Tag already exists; choose a new version'; exit 1
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/desktop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      release_version: ${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download versioned builds from this run
        uses: actions/download-artifact@v4
        with:
          pattern: RHINE-MUSIC-DATABASE-*
          path: artifacts
      - name: Collect exact release packages
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          for platform in macOS-arm64.zip Windows-x64.zip Linux-x86_64.AppImage; do
            name="RhineMusicDatabase-${RELEASE_TAG}-${platform}"
            mapfile -t files < <(find artifacts -type f -name "$name")
            [[ "${#files[@]}" -eq 1 ]] || { echo "Missing or ambiguous package: $name"; exit 1; }
            cp "${files[0]}" "release/$name"
          done
          chmod 0755 release/*.AppImage
          node scripts/create-update-feed.cjs release "$RELEASE_TAG"
      # 先上传为草稿；三平台附件齐全且 GitHub 已返回 SHA-256 后才对用户可见。
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" --generate-notes --draft
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          release = json.load(open('release.json'))
          assets = {asset['name']: asset for asset in release['assets']}
          files = list(pathlib.Path('release').iterdir())
          assert len(assets) == len(files) == 4
          for file in files:
              asset = assets[file.name]
              digest = 'sha256:' + hashlib.file_digest(file.open('rb'), 'sha256').hexdigest()
              assert asset.get('digest') == digest, 'GitHub asset checksum mismatch'
              assert asset['size'] == file.stat().st_size
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
