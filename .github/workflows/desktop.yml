name: Desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            qt-arch: clang_64
            node-platform: darwin-arm64
            artifact: macOS-arm64
          - name: Windows x64
            os: windows-2022
            qt-arch: win64_msvc2022_64
            node-platform: win-x64
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      NODE_VERSION: '22.14.0'
      RHINE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            MusicBridge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          modules: qtshadertools qtmultimedia
          cache: true
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check repository boundaries
        run: node scripts/check-repository.cjs
      - name: Download standalone Node and verify checksum
        shell: bash
        env:
          NODE_PLATFORM: ${{ matrix.node-platform }}
        run: |
          set -euo pipefail
          distribution="node-v${NODE_VERSION}-${NODE_PLATFORM}"
          extension=tar.gz
          [[ "$RUNNER_OS" == Windows ]] && extension=zip
          archive="${distribution}.${extension}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/${archive}" -o "$archive"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o SHASUMS256.txt
          python - "$archive" <<'PY'
          import hashlib, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          checksums = dict(line.split()[::-1] for line in pathlib.Path('SHASUMS256.txt').read_text().splitlines())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == checksums[archive.name], 'Node checksum mismatch'
          PY
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -e "$archive" .
            echo "RHINE_NODE_BINARY=$(cygpath -w "$RUNNER_TEMP/$distribution/node.exe")" >> "$GITHUB_ENV"
            echo "RHINE_NODE_LICENSE=$(cygpath -w "$RUNNER_TEMP/$distribution/LICENSE")" >> "$GITHUB_ENV"
          else
            tar -xzf "$archive"
            echo "RHINE_NODE_BINARY=$RUNNER_TEMP/$distribution/bin/node" >> "$GITHUB_ENV"
            echo "RHINE_NODE_LICENSE=$RUNNER_TEMP/$distribution/LICENSE" >> "$GITHUB_ENV"
          fi
      - name: Build and deploy
        run: npm run build
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
      - name: Create distribution ZIP
        run: npm run share
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: RHINE-MUSIC-DATABASE-${{ matrix.artifact }}
          path: output/RhineMusicDatabase-*.zip
          if-no-files-found: error
